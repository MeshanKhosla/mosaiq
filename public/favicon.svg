<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d9488;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#14b8a6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2dd4bf;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background with rounded square -->
  <rect x="4" y="4" width="56" height="56" rx="12" fill="url(#grad1)"/>
  
  <!-- Bar chart bars representing data visualization -->
  <!-- Bar 1 (left, shortest) -->
  <rect x="18" y="44" width="6" height="8" fill="white" rx="1"/>
  <!-- Bar 2 (left-middle, medium) -->
  <rect x="26" y="36" width="6" height="16" fill="white" rx="1"/>
  <!-- Bar 3 (right-middle, tall) -->
  <rect x="34" y="24" width="6" height="28" fill="white" rx="1"/>
  <!-- Bar 4 (right, medium-tall) -->
  <rect x="42" y="30" width="6" height="22" fill="white" rx="1"/>
  
  <!-- Mosaic pattern overlay on bars for "Mosaiq" theme -->
  <!-- Bar 1 tiles -->
  <rect x="19" y="45" width="2" height="2" fill="#0d9488" opacity="0.4"/>
  <rect x="21" y="47" width="2" height="2" fill="#14b8a6" opacity="0.4"/>
  
  <!-- Bar 2 tiles -->
  <rect x="27" y="37" width="2" height="2" fill="#0d9488" opacity="0.4"/>
  <rect x="29" y="39" width="2" height="2" fill="#14b8a6" opacity="0.4"/>
  <rect x="27" y="41" width="2" height="2" fill="#2dd4bf" opacity="0.4"/>
  
  <!-- Bar 3 tiles -->
  <rect x="35" y="25" width="2" height="2" fill="#0d9488" opacity="0.4"/>
  <rect x="37" y="27" width="2" height="2" fill="#14b8a6" opacity="0.4"/>
  <rect x="35" y="29" width="2" height="2" fill="#2dd4bf" opacity="0.4"/>
  <rect x="37" y="31" width="2" height="2" fill="#0d9488" opacity="0.4"/>
  
  <!-- Bar 4 tiles -->
  <rect x="43" y="31" width="2" height="2" fill="#0d9488" opacity="0.4"/>
  <rect x="45" y="33" width="2" height="2" fill="#14b8a6" opacity="0.4"/>
  <rect x="43" y="35" width="2" height="2" fill="#2dd4bf" opacity="0.4"/>
  
  <!-- Chart baseline -->
  <line x1="16" y1="52" x2="48" y2="52" stroke="white" stroke-width="1.5" opacity="0.3"/>
</svg>
